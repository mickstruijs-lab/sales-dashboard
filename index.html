<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Game Sales Dashboard</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for compiling JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts & Dependencies -->
  <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

  <style>
    body { margin: 0; background-color: #0b0f19; color: #f1f5f9; font-family: 'Inter', sans-serif; }
    /* Minimal custom CSS to ensure proper height */
    #root { height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, Cell, LineChart, Line, Legend, LabelList } = window.Recharts;

    // --- Inline Icon Components (Replacing lucide-react) ---
    const Globe = ({className, style}) => <svg className={className} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>;
    const Upload = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const LayoutDashboard = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
    const ChevronRight = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
    const ArrowLeft = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
    const Activity = ({className, style}) => <svg className={className} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
    const Database = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
    const Filter = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
    const Calendar = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const TrendingUp = ({className, style}) => <svg className={className} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
    const Gamepad2 = ({className, style}) => <svg className={className} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>;
    const SearchIcon = ({className, style}) => <svg className={className} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;

    // --- Map Data & Layout ---
    const REGION_LABELS = {
      'NA_Sales': 'North America',
      'EU_Sales': 'Europe',
      'JP_Sales': 'Japan',
      'Other_Sales': 'Rest of World'
    };

    const NA_COUNTRIES = ["United States of America", "Canada", "Mexico", "USA", "Greenland", "Cuba", "Dominican Republic", "Haiti", "Guatemala", "Honduras", "El Salvador", "Nicaragua", "Costa Rica", "Panama", "Jamaica", "Puerto Rico", "Bahamas"];
    const JP_COUNTRIES = ["Japan"];
    const EU_COUNTRIES = ["France", "Germany", "Italy", "Spain", "Poland", "Sweden", "Finland", "Romania", "Netherlands", "Belgium", "Greece", "Portugal", "Czechia", "Austria", "Hungary", "Denmark", "Ireland", "Lithuania", "Latvia", "Estonia", "Slovakia", "Croatia", "Bulgaria", "Slovenia", "Cyprus", "Malta"];

    const getRegionKey = (countryName) => {
      if (!countryName) return 'Other_Sales';
      if (NA_COUNTRIES.some(c => countryName.includes(c))) return 'NA_Sales';
      if (JP_COUNTRIES.some(c => countryName.includes(c))) return 'JP_Sales';
      if (EU_COUNTRIES.some(c => countryName.includes(c))) return 'EU_Sales';
      return 'Other_Sales';
    };

    const REGION_COLORS = {
      'NA_Sales': '#10b981', // Emerald
      'EU_Sales': '#3b82f6', // Blue
      'JP_Sales': '#ef4444', // Red
      'Other_Sales': '#f59e0b' // Amber
    };

    // --- Custom Map Projection ---
    const project = ([lon, lat]) => {
      const width = 800;
      const height = 500;
      const x = (lon + 180) * (width / 360);
      const clampedLat = Math.max(-85, Math.min(85, lat));
      const latRad = (clampedLat * Math.PI) / 180;
      const mercN = Math.log(Math.tan(Math.PI / 4 + latRad / 2));
      const y = (height / 2) - (width * mercN / (2 * Math.PI));
      return [x, y + 30]; 
    };

    const generatePath = (coordinates, type) => {
      if (!coordinates) return "";
      if (type === "Polygon") {
        return coordinates.map(ring => 
          "M" + ring.map(project).map(c => `${c[0].toFixed(1)},${c[1].toFixed(1)}`).join("L") + "Z"
        ).join(" ");
      } else if (type === "MultiPolygon") {
        return coordinates.map(poly => 
          poly.map(ring => 
            "M" + ring.map(project).map(c => `${c[0].toFixed(1)},${c[1].toFixed(1)}`).join("L") + "Z"
          ).join(" ")
        ).join(" ");
      }
      return "";
    };

    // --- Helper Functions for Data ---
    const aggregateTop5 = (data, groupBy, selectedRegions) => {
      const aggregated = data.reduce((acc, row) => {
        const key = row[groupBy];
        let value = 0;
        
        selectedRegions.forEach(region => {
          value += parseFloat(row[region] || 0);
        });
        
        if (key && !isNaN(value) && value > 0 && key !== "N/A") {
          acc[key] = (acc[key] || 0) + value;
        }
        return acc;
      }, {});

      return Object.entries(aggregated)
        .map(([name, value]) => ({ name, value: Number(value.toFixed(2)) }))
        .sort((a, b) => b.value - a.value)
        .slice(0, 5);
    };

    const aggregateTimeline = (data, selectedRegions) => {
      const aggregated = data.reduce((acc, row) => {
        const year = row.Year;
        if (!year || year === "N/A") return acc;
        
        let value = 0;
        selectedRegions.forEach(region => {
          value += parseFloat(row[region] || 0);
        });

        if (!isNaN(value) && value > 0) {
          acc[year] = (acc[year] || 0) + value;
        }
        return acc;
      }, {});

      return Object.entries(aggregated)
        .map(([year, sales]) => ({ year: parseInt(year), sales: Number(sales.toFixed(2)) }))
        .sort((a, b) => a.year - b.year);
    };

    function App() {
      const [rawData, setRawData] = useState([]);
      const [geoData, setGeoData] = useState(null);
      
      const [selectedRegions, setSelectedRegions] = useState([]);
      const [showDashboard, setShowDashboard] = useState(false);
      const [uploadStatus, setUploadStatus] = useState('');
      
      const minYearDataset = 1980;
      const maxYearDataset = new Date().getFullYear();
      
      const [startYear, setStartYear] = useState(minYearDataset);
      const [endYear, setEndYear] = useState(2020);

      useEffect(() => {
        fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json")
          .then(res => res.json())
          .then(data => setGeoData(data))
          .catch(err => console.error("Error loading GeoJSON", err));
      }, []);

      const toggleRegion = (regionKey) => {
        setSelectedRegions(prev => 
          prev.includes(regionKey) ? prev.filter(r => r !== regionKey) : [...prev, regionKey]
        );
      };

      const applyQuickFilter = (type) => {
        switch (type) {
          case '10years':
            setStartYear(2010);
            setEndYear(2020);
            break;
          case '20years':
            setStartYear(2000);
            setEndYear(2020);
            break;
          case 'all':
            setStartYear(minYearDataset);
            setEndYear(maxYearDataset);
            break;
          default:
            break;
        }
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        setUploadStatus('Parsing CSV...');
        const reader = new FileReader();
        
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim());
            const parsedData = [];
            
            const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/; 
            
            for (let i = 1; i < lines.length; i++) {
              const values = lines[i].split(regex).map(v => v.replace(/^"|"$/g, '').trim());
              if (values.length === headers.length) {
                const row = {};
                headers.forEach((header, index) => {
                  row[header] = values[index];
                });
                parsedData.push(row);
              }
            }
            
            if (parsedData.length > 0 && parsedData[0].Platform) {
              setRawData(parsedData);
              setUploadStatus(`Success! Loaded ${parsedData.length} records.`);
            } else {
              setUploadStatus('Invalid CSV format. Expected Video Game Sales headers.');
            }
          } catch (err) {
            console.error("Error parsing file:", err);
            setUploadStatus('Error parsing file.');
          }
        };
        
        reader.onerror = () => {
          setUploadStatus('Error reading file.');
        };

        reader.readAsText(file);
      };

      const filteredData = useMemo(() => {
        return rawData.filter(row => {
          const year = parseInt(row.Year);
          return !isNaN(year) && year >= startYear && year <= endYear;
        });
      }, [rawData, startYear, endYear]);

      const topPlatforms = useMemo(() => aggregateTop5(filteredData, 'Platform', selectedRegions), [filteredData, selectedRegions]);
      const topGenres = useMemo(() => aggregateTop5(filteredData, 'Genre', selectedRegions), [filteredData, selectedRegions]);
      const topPublishers = useMemo(() => aggregateTop5(filteredData, 'Publisher', selectedRegions), [filteredData, selectedRegions]);
      const topGames = useMemo(() => aggregateTop5(filteredData, 'Name', selectedRegions), [filteredData, selectedRegions]);
      const timelineData = useMemo(() => aggregateTimeline(filteredData, selectedRegions), [filteredData, selectedRegions]);

      const DarkChartCard = ({ title, data, color, icon: Icon, type = "bar" }) => (
        <div className="bg-[#1e2330] p-5 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.3)] border border-slate-700/50 flex flex-col h-80 relative overflow-hidden group hover:border-slate-600 transition-colors">
          <h3 className="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2 relative z-10">
            <Icon className="w-5 h-5" style={{ color: color }} />
            {title}
          </h3>
          <div className="flex-1 min-h-0 relative z-10">
            {data.length > 0 ? (
              <ResponsiveContainer width="100%" height="100%">
                {type === "bar" ? (
                  <BarChart data={data} layout="vertical" margin={{ top: 5, right: 30, left: 10, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#334155" opacity={0.5} />
                    <XAxis type="number" hide />
                    <YAxis 
                      dataKey="name" 
                      type="category" 
                      axisLine={false} 
                      tickLine={false} 
                      tick={{ fill: '#94a3b8', fontSize: 11, fontWeight: 600 }}
                      width={120}
                    />
                    <RechartsTooltip 
                      cursor={{fill: 'rgba(255,255,255,0.05)'}}
                      contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '8px', color: '#f8fafc' }}
                      itemStyle={{ color: '#f8fafc' }}
                      formatter={(value) => [`${value}M`, 'Sales']}
                    />
                    <Bar dataKey="value" radius={[0, 4, 4, 0]} barSize={24}>
                      <LabelList 
                        dataKey="value" 
                        position="insideRight" 
                        fill="#ffffff" 
                        formatter={(val) => `${val}M`}
                        style={{ fontWeight: 'bold', fontSize: 12, textShadow: '1px 1px 2px rgba(0,0,0,0.8)' }} 
                        offset={10}
                      />
                      {data.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={color} className="hover:brightness-125 transition-all duration-300" />
                      ))}
                    </Bar>
                  </BarChart>
                ) : (
                  <LineChart data={data} margin={{ top: 5, right: 20, left: 0, bottom: 5 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#334155" opacity={0.5} />
                    <XAxis 
                      dataKey="year" 
                      tick={{ fill: '#94a3b8', fontSize: 12 }} 
                      stroke="#334155"
                    />
                    <YAxis 
                      tick={{ fill: '#94a3b8', fontSize: 12 }} 
                      stroke="#334155"
                      tickFormatter={(val) => `${val}M`}
                    />
                    <RechartsTooltip 
                      contentStyle={{ backgroundColor: '#0f172a', borderColor: '#334155', borderRadius: '8px', color: '#f8fafc' }}
                      itemStyle={{ color: '#f8fafc' }}
                      labelStyle={{ color: '#94a3b8', marginBottom: '4px' }}
                      formatter={(value) => [`${value}M`, 'Sales']}
                    />
                    <Line 
                      type="monotone" 
                      dataKey="sales" 
                      stroke={color} 
                      strokeWidth={3}
                      dot={{ fill: '#0f172a', stroke: color, strokeWidth: 2, r: 4 }}
                      activeDot={{ r: 6, fill: color }}
                    />
                  </LineChart>
                )}
              </ResponsiveContainer>
            ) : (
              <div className="flex items-center justify-center h-full text-slate-500 text-sm">
                No data available in this range
              </div>
            )}
          </div>
        </div>
      );

      return (
        <div className="flex flex-col h-screen bg-[#0b0f19] font-sans text-slate-200 overflow-hidden">
          
          {!showDashboard && (
            <div className="absolute inset-0 z-20 flex flex-col items-center justify-between bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#1a2333] via-[#0c1017] to-[#05070a] overflow-hidden">
              
              <div className="relative z-10 w-full px-8 pt-12 pb-4 text-center flex flex-col items-center">
                <div className="inline-flex items-center justify-center px-4 py-1.5 mb-5 rounded-full bg-slate-800/40 border border-slate-700/50 backdrop-blur-md shadow-inner">
                  <Globe className="w-4 h-4 text-cyan-400 mr-2" />
                  <span className="text-xs font-bold tracking-widest uppercase text-slate-300">Geospatial Analysis</span>
                </div>
                <h1 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-slate-500 tracking-tight drop-shadow-2xl">
                  Global Sales Explorer
                </h1>
                <p className="text-slate-400 mt-4 text-sm md:text-base font-light tracking-wide max-w-2xl">
                  Select regional territories on the map below, upload your dataset, and initialize the dashboard.
                </p>
              </div>

              <div className="w-full relative flex-1 flex items-center justify-center p-4 min-h-[400px] max-h-[55vh]">
                <div className="w-full h-full max-w-5xl rounded-2xl overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5),0_0_30px_rgba(6,182,212,0.15)] border border-slate-600/60 transition-shadow hover:shadow-[0_20px_50px_rgba(0,0,0,0.5),0_0_50px_rgba(6,182,212,0.25)] relative bg-[#bfdbfe]">
                  {geoData ? (
                    <svg viewBox="0 0 800 500" className="w-full h-full">
                      {geoData.features.map((feature, i) => {
                        const countryName = feature.properties.name;
                        const regionKey = getRegionKey(countryName);
                        const isSelected = selectedRegions.includes(regionKey);
                        
                        const selectedColor = REGION_COLORS[regionKey];
                        const defaultColor = "#f3f4f6"; 
                        const hoverColor = isSelected ? selectedColor : "#d1d5db";

                        const pathData = generatePath(feature.geometry.coordinates, feature.geometry.type);
                        if (!pathData) return null;

                        return (
                          <path
                            key={i}
                            d={pathData}
                            fill={isSelected ? selectedColor : defaultColor}
                            stroke={isSelected ? "#4b5563" : "#9ca3af"}
                            strokeWidth={isSelected ? 1 : 0.5}
                            className="cursor-pointer transition-all duration-200"
                            onMouseEnter={(e) => {
                              e.currentTarget.style.fill = hoverColor;
                            }}
                            onMouseLeave={(e) => {
                              e.currentTarget.style.fill = isSelected ? selectedColor : defaultColor;
                            }}
                            onClick={() => toggleRegion(regionKey)}
                          >
                            <title>{`${countryName} (${REGION_LABELS[regionKey]})`}</title>
                          </path>
                        );
                      })}
                    </svg>
                  ) : (
                    <div className="w-full h-full flex flex-col items-center justify-center text-slate-600 bg-[#bfdbfe]">
                      <Globe className="w-10 h-10 animate-spin mb-4 text-blue-500" />
                      <span className="font-semibold text-blue-900/60">Loading map data...</span>
                    </div>
                  )}
                </div>
              </div>

              <div className="relative z-10 pb-12 pt-6 flex flex-col items-center gap-6 w-full">
                <div className="flex flex-col md:flex-row items-center gap-6 bg-slate-800/30 backdrop-blur-md p-6 rounded-3xl border border-slate-700/50 shadow-2xl relative">
                  
                  <div className="flex flex-col items-center gap-2">
                    <label className="flex items-center gap-3 px-8 py-3.5 bg-slate-900/50 hover:bg-slate-800/80 border border-slate-600 hover:border-cyan-500/50 rounded-xl cursor-pointer transition-all text-sm font-semibold text-slate-200 shadow-inner group">
                      <Upload className="w-5 h-5 text-cyan-400 group-hover:-translate-y-0.5 transition-transform" />
                      Upload Dataset
                      <input 
                        type="file" 
                        accept=".csv" 
                        className="hidden" 
                        onChange={handleFileUpload} 
                      />
                    </label>
                    {uploadStatus && (
                      <div className="absolute -bottom-8 left-0 right-0 flex justify-center">
                        <span className={`text-xs font-semibold px-4 py-1.5 rounded-full whitespace-nowrap shadow-lg ${rawData.length > 0 ? 'text-emerald-400 bg-emerald-900/60 border border-emerald-500/30' : 'text-slate-400 bg-slate-900/80 border border-slate-700'}`}>
                          {uploadStatus}
                        </span>
                      </div>
                    )}
                  </div>

                  <div className="hidden md:block w-px h-12 bg-slate-700/50"></div>

                  <button 
                    onClick={() => setShowDashboard(true)}
                    disabled={selectedRegions.length === 0 || rawData.length === 0}
                    className={`group relative flex items-center gap-3 px-10 py-3.5 rounded-xl font-bold text-sm uppercase tracking-widest transition-all overflow-hidden border
                      ${(selectedRegions.length > 0 && rawData.length > 0)
                        ? 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white border-transparent shadow-[0_0_20px_rgba(6,182,212,0.4)] cursor-pointer hover:shadow-[0_0_30px_rgba(6,182,212,0.6)]' 
                        : 'bg-slate-800/40 text-slate-500 border-slate-700 cursor-not-allowed'
                      }`}
                  >
                    <LayoutDashboard className="w-5 h-5" />
                    Initialize Dashboard
                    <ChevronRight className={`w-5 h-5 transition-transform ${selectedRegions.length > 0 && rawData.length > 0 ? 'group-hover:translate-x-1' : ''}`} />
                  </button>
                </div>
              </div>
            </div>
          )}

          {showDashboard && (
            <div className="absolute inset-0 flex flex-col z-30 animate-in fade-in zoom-in-95 duration-300 bg-[#0c1017]">
              
              <header className="bg-[#121824] border-b border-slate-800 px-6 py-4 flex items-center justify-between z-10 shrink-0 shadow-md">
                <div className="flex items-center gap-4">
                  <button 
                    onClick={() => setShowDashboard(false)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors flex items-center gap-2 border border-slate-700"
                  >
                    <ArrowLeft className="w-4 h-4" />
                    <span className="text-sm font-semibold">Back to Map</span>
                  </button>
                  <div className="h-6 w-px bg-slate-800 mx-2"></div>
                  <div className="flex items-center gap-3">
                    <Activity className="w-5 h-5 text-cyan-400" />
                    <h1 className="text-xl font-bold text-slate-100">Sales Dashboard</h1>
                  </div>
                </div>
                
                <div className="hidden md:flex items-center gap-2 px-4 py-2 bg-slate-800/40 border border-slate-700/50 rounded-lg">
                  <Database className="w-4 h-4 text-slate-400" />
                  <span className="text-sm text-slate-300 font-medium">
                    {rawData.length.toLocaleString()} Records
                  </span>
                </div>
              </header>

              <div className="flex flex-1 overflow-hidden">
                <aside className="w-72 bg-[#121824] border-r border-slate-800 flex flex-col h-full z-10 shrink-0">
                  <div className="p-6 flex-1 overflow-y-auto space-y-8">
                    
                    <div className="space-y-3">
                      <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <Globe className="w-4 h-4" /> Selected Regions
                      </h2>
                      <div className="flex flex-wrap gap-2">
                        {Object.entries(REGION_LABELS).map(([regionKey, label]) => {
                          const isActive = selectedRegions.includes(regionKey);
                          return (
                            <button
                              key={regionKey}
                              onClick={() => toggleRegion(regionKey)}
                              className={`px-3 py-1.5 border text-xs font-semibold rounded-md transition-colors ${
                                isActive 
                                  ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.2)]' 
                                  : 'bg-slate-800/50 border-slate-700/50 text-slate-500 hover:text-slate-300'
                              }`}
                            >
                              {label}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="space-y-5 pt-6 border-t border-slate-800/50">
                       <h2 className="text-xs font-bold uppercase tracking-widest text-slate-500 flex items-center gap-2">
                        <Filter className="w-4 h-4" /> Year Filter
                      </h2>
                      
                      <div className="space-y-3">
                        <div className="flex items-center gap-2">
                          <input 
                            type="number" 
                            value={startYear} 
                            onChange={(e) => setStartYear(Number(e.target.value))}
                            className="w-full px-3 py-2 bg-[#0c1017] border border-slate-700 rounded-lg text-sm text-slate-200 text-center focus:outline-none focus:border-cyan-500"
                          />
                          <span className="text-slate-500 font-medium">-</span>
                          <input 
                            type="number" 
                            value={endYear} 
                            onChange={(e) => setEndYear(Number(e.target.value))}
                            className="w-full px-3 py-2 bg-[#0c1017] border border-slate-700 rounded-lg text-sm text-slate-200 text-center focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 gap-2 pt-2">
                        <button onClick={() => applyQuickFilter('10years')} className="px-3 py-2.5 text-sm bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700 rounded-lg transition-all text-left flex items-center gap-3">
                          <Calendar className="w-4 h-4 text-cyan-500" /> Last 10 Years
                        </button>
                        <button onClick={() => applyQuickFilter('20years')} className="px-3 py-2.5 text-sm bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700 rounded-lg transition-all text-left flex items-center gap-3">
                          <Calendar className="w-4 h-4 text-cyan-500" /> Last 20 Years
                        </button>
                        <button onClick={() => applyQuickFilter('all')} className="px-3 py-2.5 text-sm bg-slate-800/50 border border-slate-700/50 hover:bg-slate-700 rounded-lg transition-all text-left flex items-center gap-3">
                          <Activity className="w-4 h-4 text-emerald-500" /> All Time
                        </button>
                      </div>
                    </div>
                  </div>
                </aside>

                <div className="flex-1 overflow-y-auto p-6 bg-[#0c1017] space-y-6">
                  <DarkChartCard 
                    title="Sales Timeline (Selected Regions)" 
                    data={timelineData} 
                    color="#facc15" 
                    icon={TrendingUp} 
                    type="line"
                  />

                  <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 pb-8">
                    <DarkChartCard title="Top 5 Genres" data={topGenres} color="#8b5cf6" icon={Activity} />
                    <DarkChartCard title="Top 5 Publishers" data={topPublishers} color="#10b981" icon={Globe} />
                    <DarkChartCard title="Top 5 Platforms" data={topPlatforms} color="#06b6d4" icon={Gamepad2} />
                    <DarkChartCard title="Top 5 Game Names" data={topGames} color="#f43f5e" icon={SearchIcon} />
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
